  }
  :root[data-theme="light"]{

  .note{font-size:12.5px; color:var(--faint); line-height:1.6}

  .hidden{display:none!important}
  .toast{position:fixed; bottom:22px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--text); color:var(--bg); padding:11px 18px; border-radius:var(--radius-sm); font-size:13.5px; font-weight:550; opacity:0; transition:opacity .22s, transform .22s; z-index:80; pointer-events:none; box-shadow:0 12px 30px -12px rgba(0,0,0,.4)}

<script>
"use strict";
/* ============================================================
   Tally - a private, offline personal finance tracker.
   Everything is local. State lives in localStorage under 'tally.v1'.
   No network requests are ever made. Zero dependencies.
   ============================================================ */

const $  = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const el = (t,a={},...kids)=>{const n=document.createElement(t);for(const k in a){if(k==="class")n.className=a[k];else if(k==="html")n.innerHTML=a[k];else if(k.startsWith("on"))n.addEventListener(k.slice(2),a[k]);else if(a[k]!=null)n.setAttribute(k,a[k]);}for(const c of kids.flat()){if(c!=null)n.append(c.nodeType?c:document.createTextNode(c));}return n;};

/* ---------- categories ---------- */
const CATS = [
  ["Income","#16a34a"],["Housing","#7c3aed"],["Groceries","#059669"],
  ["Dining","#ea580c"],["Transport","#2563eb"],["Utilities","#0891b2"],
  ["Subscriptions","#db2777"],["Shopping","#d97706"],["Health","#dc2626"],
  ["Entertainment","#c026d3"],["Savings","#0d9488"],["Transfers","#64748b"],
  ["Fees","#a16207"],["Uncategorized","#9ca3af"]
];
const catColor = name => (CATS.find(c=>c[0]===name)||["",""])[1] || "#9ca3af";

/* default keyword → category rules (editable, stored locally) */
const DEFAULT_RULES = [
  ["salary","Income"],["payroll","Income"],["deposit","Income"],["refund","Income"],["interest","Income"],
  ["rent","Housing"],["mortgage","Housing"],["landlord","Housing"],
  ["whole foods","Groceries"],["trader joe","Groceries"],["safeway","Groceries"],["grocery","Groceries"],["aldi","Groceries"],["kroger","Groceries"],["market","Groceries"],
  ["starbucks","Dining"],["mcdonald","Dining"],["restaurant","Dining"],["cafe","Dining"],["coffee","Dining"],["pizza","Dining"],["chipotle","Dining"],["doordash","Dining"],["uber eats","Dining"],
  ["uber","Transport"],["lyft","Transport"],["shell","Transport"],["chevron","Transport"],["gas","Transport"],["transit","Transport"],["parking","Transport"],["metro","Transport"],
  ["electric","Utilities"],["water","Utilities"],["comcast","Utilities"],["at&t","Utilities"],["verizon","Utilities"],["internet","Utilities"],["utility","Utilities"],
  ["netflix","Subscriptions"],["spotify","Subscriptions"],["hulu","Subscriptions"],["disney","Subscriptions"],["youtube premium","Subscriptions"],["icloud","Subscriptions"],["adobe","Subscriptions"],["prime","Subscriptions"],["gym","Subscriptions"],["patreon","Subscriptions"],
  ["amazon","Shopping"],["target","Shopping"],["walmart","Shopping"],["etsy","Shopping"],["best buy","Shopping"],["ikea","Shopping"],
  ["pharmacy","Health"],["cvs","Health"],["walgreens","Health"],["doctor","Health"],["dental","Health"],["clinic","Health"],
  ["cinema","Entertainment"],["movie","Entertainment"],["steam","Entertainment"],["playstation","Entertainment"],["concert","Entertainment"],["ticket","Entertainment"],
  ["transfer","Transfers"],["venmo","Transfers"],["zelle","Transfers"],["paypal","Transfers"],
  ["fee","Fees"],["atm","Fees"],["overdraft","Fees"],
];

/* ---------- state ---------- */
const KEY = "tally.v1";
const defaultState = ()=>({ transactions:[], rules:DEFAULT_RULES.slice(), budgets:{}, settings:{currency:"USD", startingBalance:null, theme:null} });
let CRYPTO = { key:null, salt:null };  // set when the store is encrypted & unlocked
let LOCKED = null;                     // holds the encrypted envelope until a passphrase unlocks it
let S = load();
function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      if(parsed && parsed.enc){ LOCKED = parsed; return defaultState(); } // wait for passphrase
      return migrate(parsed);
    }
  }catch(e){}
  return defaultState();
}
function migrate(s){
  s.transactions ||= []; s.rules ||= DEFAULT_RULES.slice(); s.budgets ||= {};
  s.settings ||= {}; s.settings.currency ||= "USD";
  if(s.settings.startingBalance===undefined) s.settings.startingBalance=null;
  return s;
}
async function save(){
  if(LOCKED) return; // never overwrite the encrypted store before it is unlocked
  try{
    const raw = CRYPTO.key ? await encryptWith(CRYPTO.key, CRYPTO.salt, S) : JSON.stringify(S);
    localStorage.setItem(KEY, raw);
  }catch(e){ toast("Storage error - export a backup."); }
}

/* ---------- encryption (AES-256-GCM + PBKDF2, via Web Crypto) ----------
   When a passphrase is set, the entire store is ciphertext at rest. The
   passphrase never leaves memory; there is no recovery and nothing to phone
   home to. deriveKey/encryptWith/decryptWith are covered by test.js. */
const _enc = new TextEncoder(), _dec = new TextDecoder();
function _b64(buf){ const b=new Uint8Array(buf); let s=""; for(let i=0;i<b.length;i++) s+=String.fromCharCode(b[i]); return btoa(s); }
function _unb64(str){ return Uint8Array.from(atob(str), c=>c.charCodeAt(0)); }
async function deriveKey(pass, salt){
  const base = await crypto.subtle.importKey("raw", _enc.encode(pass), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2", salt, iterations:250000, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["encrypt","decrypt"]);
}
async function encryptWith(key, salt, obj){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({name:"AES-GCM", iv}, key, _enc.encode(JSON.stringify(obj)));
  return JSON.stringify({ v:1, enc:true, salt:_b64(salt), iv:_b64(iv), ct:_b64(ct) });
}
async function decryptWith(key, envelope){
  const iv = _unb64(envelope.iv), ct = _unb64(envelope.ct);
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv}, key, ct);
  return JSON.parse(_dec.decode(pt));
}

/* ---------- helpers ---------- */
const uid = ()=>Math.random().toString(36).slice(2,10);
function money(n,{sign=false}={}){
  const f = new Intl.NumberFormat(undefined,{style:"currency",currency:S.settings.currency||"USD",maximumFractionDigits:2});
  const s = f.format(Math.abs(n));
  if(sign) return (n>0?"+":n<0?"−":"")+s;
  return (n<0?"−":"")+s;
}
const ym = d => d.slice(0,7);
const monthLabel = key => { const [y,m]=key.split("-"); return new Date(y,m-1,1).toLocaleString(undefined,{month:"long",year:"numeric"}); };
const shortDate = d => { const dt=new Date(d+"T00:00"); return dt.toLocaleDateString(undefined,{month:"short",day:"numeric"}); };
function norm(desc){ return desc.toLowerCase().replace(/[0-9]/g," ").replace(/[^a-z& ]/g," ").replace(/\b(pos|purchase|debit|card|payment|recurring|ach|xxx|ref|id|no)\b/g," ").replace(/\s+/g," ").trim(); }
function categorize(desc){
  const d=desc.toLowerCase();
  for(const [kw,cat] of S.rules){ if(d.includes(kw)) return cat; }
  return "Uncategorized";
}
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("show"),2200); }

/* ---------- derived data ---------- */
function months(){ return [...new Set(S.transactions.map(t=>ym(t.date)))].sort(); }
function txForMonth(key){ return S.transactions.filter(t=>ym(t.date)===key); }
function sum(arr,f=x=>x){ return arr.reduce((a,b)=>a+f(b),0); }
function net(){ return sum(S.transactions,t=>t.amount); }
function currentBalance(){
  return S.settings.startingBalance!=null ? S.settings.startingBalance : net();
}
function nMonthsData(){ return Math.max(1, months().length); }

/* recurring / subscription detection */
function detectRecurring(sign){ // sign: -1 expenses, +1 income
  const groups={};
  for(const t of S.transactions){
    if(Math.sign(t.amount)!==sign) continue;
    const k=norm(t.desc); if(k.length<3) continue;
    (groups[k]||=[]).push(t);
  }
  const out=[];
  for(const k in groups){
    const g=groups[k].slice().sort((a,b)=>a.date<b.date?-1:1);
    if(g.length<2) continue;
    const gaps=[]; for(let i=1;i<g.length;i++){ gaps.push((new Date(g[i].date)-new Date(g[i-1].date))/86400000); }
    const med = gaps.slice().sort((a,b)=>a-b)[Math.floor(gaps.length/2)];
    let cadence=null, perMonth=1;
    if(med>=6&&med<=8){cadence="weekly";perMonth=4.33;}
    else if(med>=13&&med<=16){cadence="biweekly";perMonth=2.17;}
    else if(med>=26&&med<=35){cadence="monthly";perMonth=1;}
    else if(med>=85&&med<=95){cadence="quarterly";perMonth=1/3;}
    else if(med>=350&&med<=380){cadence="yearly";perMonth=1/12;}
    if(!cadence) continue;
    const amts=g.map(t=>Math.abs(t.amount));
    const avg=amts.reduce((a,b)=>a+b,0)/amts.length;
    const spread=(Math.max(...amts)-Math.min(...amts))/(avg||1);
    if(spread>0.35) continue; // inconsistent → probably not a fixed recurring charge
    out.push({ key:k, name:g[g.length-1].desc, category:g[g.length-1].category, cadence,
      amount:avg, monthly:avg*perMonth, count:g.length, last:g[g.length-1].date });
  }
  return out.sort((a,b)=>b.monthly-a.monthly);
}

function heroChart(canvas){
  const ctx = canvas.getContext("2d");
  const reduce = matchMedia("(prefers-reduced-motion:reduce)").matches;
  let t = 0, f = 0;
  function frame(){
    if(!canvas.isConnected) return;
    const w = canvas.width = Math.max(1, canvas.offsetWidth*2), h = canvas.height = Math.max(1, canvas.offsetHeight*2);
    ctx.clearRect(0,0,w,h);
    const acc = (getComputedStyle(document.documentElement).getPropertyValue("--accent")||"#4f46e5").trim();
    const N = 64, pts = [];
    for(let i=0;i<=N;i++){ const x=i/N*w; const rise=(i/N)*h*0.30; const y=h*0.70 - rise + Math.sin(i*0.32+t)*h*0.055 + Math.sin(i*0.11-t*0.6)*h*0.045; pts.push([x,y]); }
    const g = ctx.createLinearGradient(0,0,0,h); g.addColorStop(0, acc+"4d"); g.addColorStop(1, acc+"00");
    ctx.beginPath(); ctx.moveTo(0,h); pts.forEach(([x,y])=>ctx.lineTo(x,y)); ctx.lineTo(w,h); ctx.closePath(); ctx.fillStyle=g; ctx.fill();
    ctx.beginPath(); pts.forEach(([x,y],i)=> i?ctx.lineTo(x,y):ctx.moveTo(x,y)); ctx.strokeStyle=acc; ctx.lineWidth=3; ctx.globalAlpha=.9; ctx.stroke(); ctx.globalAlpha=1;
    if(!reduce && f++ < 130){ t += 0.016; requestAnimationFrame(frame); }
  }
  requestAnimationFrame(frame);
}

const monthShort = key => { const [y,m]=key.split("-"); return new Date(y,m-1,1).toLocaleString(undefined,{month:"short"}); };
function monthSpend(key){ return -sum(txForMonth(key).filter(t=>t.amount<0),t=>t.amount); }
function monthIncome(key){ return sum(txForMonth(key).filter(t=>t.amount>0),t=>t.amount); }
/* auto-generated plain-language observations about the current month */
function computeInsights(cur, ms){
  const out=[]; const idx=ms.indexOf(cur);
  const spend=monthSpend(cur), income=monthIncome(cur);
  if(idx>0){ const prev=monthSpend(ms[idx-1]); if(prev>0){ const ch=Math.round((spend-prev)/prev*100);
    if(Math.abs(ch)>=5) out.push({t:`Spending ${ch<0?"down":"up"} ${Math.abs(ch)}% vs ${monthShort(ms[idx-1])}`, tone: ch<0?"pos":"neg"}); } }
  if(income>0){ const rate=Math.round((income-spend)/income*100);
    out.push(rate>=0 ? {t:`You kept ${rate}% of your income`, tone:"pos"} : {t:`Spent ${Math.abs(rate)}% more than you earned`, tone:"neg"}); }
  const yr=sum(detectRecurring(-1),s=>s.monthly)*12;
  if(yr>0) out.push({t:`Subscriptions run ${money(yr)}/yr`, tone:"neg"});
  const byCat={}; txForMonth(cur).filter(t=>t.amount<0).forEach(t=>byCat[t.category]=(byCat[t.category]||0)+ -t.amount);
  const top=Object.entries(byCat).sort((a,b)=>b[1]-a[1])[0];
  if(top) out.push({t:`Most went to ${top[0]} (${money(top[1])})`, tone:""});
  return out.slice(0,4);
}
function insightStrip(items){
  if(!items || !items.length) return null;
  return el("div",{class:"insights"}, items.map(i=>el("div",{class:"insight"}, el("span",{class:"idot "+(i.tone||"")}), i.t)));
}
function renderOverview(){
  const ms=months(); if(!curMonth||!ms.includes(curMonth)) curMonth=ms[ms.length-1];
  const idx=ms.indexOf(curMonth);
  const tx=txForMonth(curMonth);
  const income=sum(tx.filter(t=>t.amount>0),t=>t.amount);
  const spend=-sum(tx.filter(t=>t.amount<0),t=>t.amount);
  const netM=income-spend;

  // category breakdown for month (expenses)
  const byCat={};
  tx.filter(t=>t.amount<0).forEach(t=>{ byCat[t.category]=(byCat[t.category]||0)+ -t.amount; });
  const cats=Object.entries(byCat).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const maxCat=Math.max(1,...cats.map(c=>c[1]));

  // 6-month trend
  const trend=ms.slice(-6).map(m=>{ const t=txForMonth(m); return {m, inc:sum(t.filter(x=>x.amount>0),x=>x.amount), exp:-sum(t.filter(x=>x.amount<0),x=>x.amount)}; });

  main().replaceChildren(
    el("div",{style:"display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:10px"},
      el("div",{class:"month-nav"},
        el("button",{class:"ghost icon", disabled: idx<=0?"":null, onclick:()=>{curMonth=ms[idx-1];render();}},"‹"),
        el("b",{},monthLabel(curMonth)),
        el("button",{class:"ghost icon", disabled: idx>=ms.length-1?"":null, onclick:()=>{curMonth=ms[idx+1];render();}},"›")
      ),
      el("div",{style:"display:flex;gap:8px"},
        el("button",{class:"ghost", onclick:()=>$("#fileInput").click()},"Import CSV"),
        el("button",{class:"ghost", onclick:addTxModal},"+ Add")
      )
    ),
    el("div",{class:"grid g3"},
      stat("Income this month", money(income), "pos"),
      stat("Spending this month", money(spend), "neg"),
      stat("Net", money(netM,{sign:true}), netM>=0?"pos":"neg", `Balance ${money(currentBalance())}`)
    ),
    insightStrip(computeInsights(curMonth, ms)),
    el("div",{class:"grid g2", style:"margin-top:14px"},
      el("div",{class:"card", style:"padding:18px"},
        el("div",{class:"sec-title", style:"margin:0 0 10px"},"Where it went"),
        cats.length? el("div",{}, cats.map(([c,v])=>bar(c,v,maxCat))) :
          el("div",{class:"note"},"No spending recorded this month.")
      ),
      el("div",{class:"card", style:"padding:18px"},
        el("div",{class:"sec-title", style:"margin:0 0 10px"},"Last 6 months"),
        trendChart(trend)
      )
    )
  );
}

function bar(name,val,max){
  return el("div",{class:"barrow"},
    el("div",{class:"name"}, el("span",{class:"dot",style:`background:${catColor(name)}`}), name),

function trendChart(rows){
  if(!rows.length) return el("div",{class:"note"},"Not enough data yet.");
  const W=440,H=150,pad=24, max=Math.max(1,...rows.map(r=>Math.max(r.inc,r.exp)));
  const bw=(W-pad*2)/rows.length;
  const svg=[`<svg viewBox="0 0 ${W} ${H}" width="100%" preserveAspectRatio="xMidYMid meet" style="overflow:visible">`];
  rows.forEach((r,i)=>{
    const x=pad+i*bw, cx=x+bw/2;
    const ih=(r.inc/max)*(H-pad*2), eh=(r.exp/max)*(H-pad*2);
    svg.push(`<rect x="${cx-9}" y="${H-pad-ih}" width="7.5" height="${ih}" rx="2" fill="var(--pos)" opacity=".85"/>`);
    svg.push(`<rect x="${cx+1.5}" y="${H-pad-eh}" width="7.5" height="${eh}" rx="2" fill="var(--neg)" opacity=".8"/>`);
    svg.push(`<text x="${cx}" y="${H-8}" text-anchor="middle" font-size="10" fill="var(--faint)">${r.m.slice(5)}</text>`);
  });
  svg.push(`</svg>`);
  return el("div",{}, el("div",{html:svg.join("")}),
    el("div",{class:"note",style:"margin-top:8px;display:flex;gap:14px"},
      el("span",{}, el("span",{class:"dot",style:"background:var(--pos);display:inline-block;margin-right:5px"}),"income"),
      el("span",{}, el("span",{class:"dot",style:"background:var(--neg);display:inline-block;margin-right:5px"}),"spending")
    ));
}

/* ---------- forecast (the differentiator) ---------- */
let fx={ trim:0, incomeAdj:0, cancelled:{} };
function renderForecast(){
  if(!S.transactions.length){
    main().replaceChildren(el("div",{class:"card hero"},
      el("h1",{},"See your next 12 months."),
      el("p",{},"Import your history and Tally projects your balance forward - so you can spot a shortfall months before it happens, and play with what-ifs privately."),
      el("div",{class:"cta"}, el("button",{class:"btn", onclick:loadDemo},"Try with demo data"), el("button",{class:"btn sec", onclick:()=>$("#fileInput").click()},"Import CSV"))
    ));
    return;
  }
  const nm=nMonthsData();
  const recurIncome=detectRecurring(1);
  const recurExp=detectRecurring(-1);
  const fixedRecurringExp=sum(recurExp.filter(s=>!fx.cancelled[s.key]),s=>s.monthly);
  const totalExp=-sum(S.transactions.filter(t=>t.amount<0),t=>t.amount);
  const allRecurExp=sum(recurExp,s=>s.monthly);
  const discretionary=Math.max(0, totalExp/nm - allRecurExp);
  const avgIncome=sum(S.transactions.filter(t=>t.amount>0),t=>t.amount)/nm;

  const income=avgIncome*(1+fx.incomeAdj/100);
  const spend=fixedRecurringExp + discretionary*(1-fx.trim/100);
  const monthlyNet=income-spend;

  // project
  let bal=currentBalance(); const pts=[{label:"now",bal}];
  let firstNeg=null;
  const now=new Date();
  for(let i=1;i<=12;i++){
    bal+=monthlyNet;
    const d=new Date(now.getFullYear(),now.getMonth()+i,1);
    const lbl=d.toLocaleString(undefined,{month:"short"});
    pts.push({label:lbl,bal});
    if(bal<0&&firstNeg===null) firstNeg=d.toLocaleString(undefined,{month:"long",year:"numeric"});
  }
  const end=pts[pts.length-1].bal;

  main().replaceChildren(
    el("div",{class:"grid g3"},
      stat("Monthly net", money(monthlyNet,{sign:true}), monthlyNet>=0?"pos":"neg", monthlyNet>=0?"you're building a cushion":"you're drawing down"),
      stat("In 12 months", money(end), end>=currentBalance()?"pos":"neg", `from ${money(currentBalance())} today`),
      firstNeg? stat("Runs negative", firstNeg, "neg", "at this pace") : stat("Stays positive", "✓ all year", "pos", "no shortfall projected")
    ),
    el("div",{class:"card",style:"padding:20px;margin-top:14px"},
      el("div",{class:"sec-title",style:"margin:0 0 6px"},"Projected balance"),
      forecastChart(pts, firstNeg!==null),
    ),
    el("div",{class:"grid g2",style:"margin-top:14px"},
      el("div",{class:"card",style:"padding:18px 20px"},
        el("div",{class:"sec-title",style:"margin:0 0 4px"},"What if…"),
        el("div",{class:"lever"},
          el("label",{},"Trim discretionary spending", el("span",{class:"hint"},"eating out, shopping, the small stuff")),
          el("input",{type:"range",min:0,max:60,step:5,value:fx.trim, oninput:e=>{fx.trim=+e.target.value;renderForecast();}}),
          el("span",{class:"rangeval"}, fx.trim+"%")
        ),
        el("div",{class:"lever"},

function forecastChart(pts, dips){
  const W=760,H=200,padL=8,padR=8,padT=16,padB=26;
  const vals=pts.map(p=>p.bal); const min=Math.min(0,...vals), max=Math.max(...vals,1);
  const span=(max-min)||1;
  const x=i=>padL+i*((W-padL-padR)/(pts.length-1));
  const y=v=>padT+(1-(v-min)/span)*(H-padT-padB);
  const line=pts.map((p,i)=>`${i?"L":"M"}${x(i).toFixed(1)},${y(p.bal).toFixed(1)}`).join(" ");
  const area=`${line} L${x(pts.length-1).toFixed(1)},${y(min).toFixed(1)} L${x(0).toFixed(1)},${y(min).toFixed(1)} Z`;
  const zeroY=y(0);
  const stroke=dips?"var(--neg)":"var(--pos)";
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" preserveAspectRatio="none" style="display:block">`;
  s+=`<defs><linearGradient id="fg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${dips?'var(--neg)':'var(--pos)'}" stop-opacity=".18"/><stop offset="1" stop-color="${dips?'var(--neg)':'var(--pos)'}" stop-opacity="0"/></linearGradient></defs>`;
  if(min<0) s+=`<line x1="${padL}" x2="${W-padR}" y1="${zeroY}" y2="${zeroY}" stroke="var(--neg)" stroke-dasharray="3 4" stroke-width="1" opacity=".6"/>`;
  s+=`<path d="${area}" fill="url(#fg)"/>`;
  s+=`<path d="${line}" fill="none" stroke="${stroke}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
  pts.forEach((p,i)=>{ if(i%1===0){ s+=`<circle cx="${x(i).toFixed(1)}" cy="${y(p.bal).toFixed(1)}" r="${i===0?3.5:2}" fill="${stroke}"/>`; s+=`<text x="${x(i).toFixed(1)}" y="${H-8}" text-anchor="middle" font-size="10" fill="var(--faint)">${p.label}</text>`; } });
  s+=`</svg>`;
  return el("div",{html:s});
}

function catPicker(t){
  openModal("Categorize", el("div",{},

    el("div",{class:"catlist"}, CATS.map(([name])=>
      el("button",{class:"catopt", "aria-pressed": name===t.category, onclick:()=>{
        t.category=name;
        // learn a rule from the strongest token so similar future txns auto-categorize
        const key=norm(t.desc).split(" ").filter(w=>w.length>=4)[0];
        if(key && !S.rules.some(r=>r[0]===key)){ S.rules.unshift([key,name]); }
        else if(key){ S.rules=S.rules.filter(r=>r[0]!==key); S.rules.unshift([key,name]); }
        // apply to all matching existing transactions
        S.transactions.forEach(x=>{ if(key && norm(x.desc).includes(key)) x.category=name; });
        save(); closeModal(); render(); toast(key?`Learned: "${key}" → ${name}`:`Set to ${name}`);
      }}, el("span",{class:"dot",style:`background:${catColor(name)}`}), name)
    ))
  ));

/* ---------- CSV import ---------- */
function parseCSV(text){
  const rows=[]; let row=[], cell="", q=false;
  text=text.replace(/\r\n/g,"\n").replace(/\r/g,"\n");
  for(let i=0;i<text.length;i++){ const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){cell+='"';i++;} else q=false; } else cell+=c; }
    else { if(c==='"')q=true; else if(c===","){row.push(cell);cell="";} else if(c==="\n"){row.push(cell);rows.push(row);row=[];cell="";} else cell+=c; }
  }
  if(cell!==""||row.length){ row.push(cell); rows.push(row); }
  return rows.filter(r=>r.some(x=>x.trim()!==""));
}
function importCSV(text){
  const rows=parseCSV(text); if(rows.length<2){ toast("That CSV looks empty."); return; }
  const header=rows[0].map(h=>h.trim().toLowerCase());
  const find=(...names)=>{ for(const n of names){ const i=header.findIndex(h=>h.includes(n)); if(i>=0)return i; } return -1; };
  let di=find("date","posted","time");
  let desci=find("description","name","payee","merchant","memo","details","narration");
  let ai=find("amount","value");
  let debiti=find("debit","withdrawal","paid out","money out");
  let crediti=find("credit","deposit","paid in","money in");
  // fallback heuristics
  if(di<0) di=0;
  if(desci<0) desci=header.findIndex((h,i)=>i!==di && isNaN(Date.parse(rows[1][i])));
  if(desci<0) desci=1;

  openColumnMapper(rows, header, {di,desci,ai,debiti,crediti});
}
function openColumnMapper(rows, header, guess){
  const opts=header.map((h,i)=>[String(i), h||("col "+(i+1))]);
  const sel=(id,val,allowNone)=>{
    const s=el("select",{id,style:"width:100%;padding:9px 11px;border:1px solid var(--border-strong);border-radius:9px;background:var(--surface)"});
    if(allowNone) s.append(el("option",{value:"-1"},"none"));
    opts.forEach(([v,l])=>{ const o=el("option",{value:v},l); if(+v===val)o.selected=true; s.append(o); });
    return s;
  };
  const body=el("div",{},
    el("div",{class:"note",style:"margin-bottom:14px"},`Found ${rows.length-1} rows. Match the columns - Tally guessed for you.`),
    el("div",{class:"field"}, el("label",{},"Date column"), sel("m_date",guess.di,false)),
    el("div",{class:"field"}, el("label",{},"Description column"), sel("m_desc",guess.desci,false)),
    el("div",{class:"field"}, el("label",{},"Amount column (single, signed)"), sel("m_amt",guess.ai,true)),
    el("div",{class:"note",style:"margin:-4px 0 12px"},"…or use separate debit / credit columns:"),
    el("div",{class:"grid g2",style:"gap:10px"},
      el("div",{class:"field",style:"margin:0"}, el("label",{},"Debit / out"), sel("m_deb",guess.debiti,true)),
      el("div",{class:"field",style:"margin:0"}, el("label",{},"Credit / in"), sel("m_cred",guess.crediti,true))
    ),
    el("label",{class:"subtoggle",style:"margin-top:12px"}, el("input",{type:"checkbox", id:"m_flip"}), el("span",{class:"sname",style:"text-transform:none"},"Spending is shown as a positive number in this file"))
  );
  openModal("Import CSV", body, [
    el("button",{class:"ghost", onclick:closeModal},"Cancel"),
    el("button",{class:"btn", onclick:()=>{
      const di=+$("#m_date").value, desci=+$("#m_desc").value, ai=+$("#m_amt").value, dbi=+$("#m_deb").value, cri=+$("#m_cred").value, flip=$("#m_flip").checked;
      const parsed=[]; let bad=0;
      for(let r=1;r<rows.length;r++){
        const row=rows[r]; if(!row) continue;
        const rawDate=(row[di]||"").trim(); const desc=(row[desci]||"").trim();
        let amt=NaN;
        if(dbi>=0||cri>=0){ const d=parseNum(row[dbi]), c=parseNum(row[cri]); amt=(c||0)-(d||0); }
        else if(ai>=0){ amt=parseNum(row[ai]); if(flip) amt=-amt; }
        const date=parseDate(rawDate);
        if(!date||!desc||isNaN(amt)||amt===0){ bad++; continue; }
        parsed.push({id:uid(), date, desc, amount:amt, category:categorize(desc)});
      }
      if(!parsed.length){ toast("Couldn't read any rows - check the column mapping."); return; }
      S.transactions.push(...parsed);
      dedupe(); save(); closeModal(); VIEW="overview"; curMonth=null; render();
      toast(`Imported ${parsed.length} transaction${parsed.length!==1?"s":""}${bad?` (${bad} skipped)`:""}.`);
    }},"Import")
  ]);
}
function parseNum(v){ if(v==null)return NaN; v=String(v).replace(/[^0-9.\-()]/g,""); if(/^\(.*\)$/.test(v))v="-"+v.replace(/[()]/g,""); const n=parseFloat(v); return isNaN(n)?NaN:n; }
function parseDate(s){
  s=s.trim(); if(!s) return null;
  let m;
  if(m=s.match(/^(\d{4})[-/](\d{1,2})[-/](\d{1,2})/)) return `${m[1]}-${p2(m[2])}-${p2(m[3])}`;
  if(m=s.match(/^(\d{1,2})[-/](\d{1,2})[-/](\d{2,4})/)){ // assume MM/DD/YYYY (US bank default)
    let [_,a,b,y]=m; if(y.length===2)y="20"+y; return `${y}-${p2(a)}-${p2(b)}`;
  }
  const d=new Date(s); return isNaN(d)?null:d.toISOString().slice(0,10);
}
const p2=n=>String(n).padStart(2,"0");
function dedupe(){
  const seen=new Set(); S.transactions=S.transactions.filter(t=>{ const k=t.date+"|"+t.desc+"|"+t.amount; if(seen.has(k))return false; seen.add(k); return true; });
}

function importBackup(file){
  if(!file) return; const r=new FileReader();
  r.onload=async ()=>{ try{
    let data=JSON.parse(r.result);
    if(data && data.enc){ // encrypted backup - ask for its passphrase
      const pass=prompt("This backup is encrypted. Enter its passphrase:"); if(pass===null) return;
      data=await decryptWith(await deriveKey(pass, _unb64(data.salt)), data);
    }
    if(!data.transactions) throw 0;
    S=migrate(data); save(); closeModal(); VIEW="overview"; curMonth=null; render(); toast("Backup restored.");
  }catch(e){ toast("Couldn't read that backup (wrong passphrase or bad file)."); } };
  r.readAsText(file);
}

      el("div",{class:"note", style:"margin-bottom:18px"},"This device is encrypted. Enter your passphrase to unlock."),
      el("input",{id:"lock_pass", type:"password", placeholder:"passphrase", autocomplete:"current-password",
        style:"width:100%;padding:11px 12px;border:1px solid var(--border-strong);border-radius:9px;background:var(--surface);text-align:center;margin-bottom:10px",
        onkeydown:e=>{ if(e.key==="Enter") tryUnlock(); }}),
      el("div",{id:"lock_err", class:"note", style:"color:var(--neg);min-height:16px;margin-bottom:10px"}),
      el("button",{class:"btn", style:"width:100%", onclick:tryUnlock},"Unlock"),
      el("button",{class:"ghost", style:"margin-top:16px;font-size:12px", onclick:()=>{ if(confirm("Erase the encrypted data on this device and start fresh? This cannot be undone.")){ localStorage.removeItem(KEY); location.reload(); } }},"Forgot passphrase? Erase & start over")
    )
  );
  document.body.append(box);
  setTimeout(()=>{ const p=$("#lock_pass"); if(p) p.focus(); }, 40);
}
async function tryUnlock(){
  const p=$("#lock_pass"); const pass=p?p.value:""; if(!pass) return;
  try{
    const salt=_unb64(LOCKED.salt);
    const key=await deriveKey(pass, salt);
    const obj=await decryptWith(key, LOCKED);
    S=migrate(obj); CRYPTO={ key, salt }; LOCKED=null;
    const ls=$("#lockscreen"); if(ls) ls.remove();
    render();
  }catch(e){
    const er=$("#lock_err"); if(er) er.textContent="Wrong passphrase - try again.";
    if(p){ p.value=""; p.focus(); }
  }
}
</script>
