<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>Tally — your money, on your machine</title>
    <meta
      name="description"
      content="A private, offline personal finance tracker. No account, no cloud, no tracking."
    />
    <meta name="theme-color" content="#f7f7f3" />
    <link rel="icon" href="./favicon.svg" />
    <script>
      try {
        var t = localStorage.getItem("tally.v1.theme") || "light";
        document.documentElement.setAttribute("data-theme", t);
        if (t === "dark") document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
